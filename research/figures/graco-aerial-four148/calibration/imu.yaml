# Default imu sensor yaml file
rostopic: /gnss/imu
rate_hz: 125
sensor_type: g320N

# inertial sensor noise model parameters (static)
accelerometer_noise_density: 1.8744963e-02  # [ m / s^2 / sqrt(Hz) ]   ( accel "white noise" )
accelerometer_random_walk: 6.4808910e-04    # [ m / s^3 / sqrt(Hz) ].  ( accel bias diffusion )
gyroscope_noise_density: 5.4259815e-04     # [ rad / s / sqrt(Hz) ]   ( gyro "white noise" )
gyroscope_random_walk: 1.0949571e-05       # [ rad / s^2 / sqrt(Hz) ] ( gyro bias diffusion )

